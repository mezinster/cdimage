name: Build Releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create + release (e.g. v0.5.1). Leave blank to just build artifacts without publishing.'
        required: false
        type: string

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          # qt6-l10n-tools provides lrelease/lupdate, which qmake invokes when
          # `CONFIG += lrelease embed_translations` is set in cdimage.pro.
          # qt6-tools-dev-tools alone does NOT include them on Ubuntu 22.04.
          sudo apt-get install -y qt6-base-dev qt6-tools-dev-tools qt6-l10n-tools build-essential libgl-dev

      - name: Build
        run: qmake6 cdimage.pro && make -j$(nproc)

      - name: Package
        run: |
          strip cdimage
          tar czf cdimage-linux-x86_64.tar.gz cdimage

      - uses: actions/upload-artifact@v4
        with:
          name: cdimage-linux-x86_64
          path: cdimage-linux-x86_64.tar.gz

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          qmake cdimage.pro
          nmake

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item release\cdimage.exe dist\
          windeployqt --release dist\cdimage.exe
          Compress-Archive -Path dist\* -DestinationPath cdimage-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cdimage-windows-x64
          path: cdimage-windows-x64.zip

  # ── GitHub Release ─────────────────────────────────────────────────────────
  # Triggered by either a tag push (`refs/tags/vX.Y.Z`) or a manual dispatch
  # with `version` set. In the dispatch case this job creates and pushes the
  # tag at the dispatched ref's HEAD, then publishes the release.
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so generate_release_notes can diff

      - name: Resolve and validate tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ github.event.inputs.version }}'
          else
            TAG='${{ github.ref_name }}'
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Tag '$TAG' must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Create and push tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally; aborting to avoid overwriting"
            exit 1
          fi
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; aborting"
            exit 1
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            cdimage-linux-x86_64/cdimage-linux-x86_64.tar.gz
            cdimage-windows-x64/cdimage-windows-x64.zip
