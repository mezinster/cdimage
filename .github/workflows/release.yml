name: Build Releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev-tools build-essential libgl-dev

      - name: Build
        run: qmake6 cdimage.pro && make -j$(nproc)

      - name: Package
        run: |
          strip cdimage
          tar czf cdimage-linux-x86_64.tar.gz cdimage

      - uses: actions/upload-artifact@v4
        with:
          name: cdimage-linux-x86_64
          path: cdimage-linux-x86_64.tar.gz

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          qmake cdimage.pro
          nmake

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item release\cdimage.exe dist\
          windeployqt --release dist\cdimage.exe
          Compress-Archive -Path dist\* -DestinationPath cdimage-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cdimage-windows-x64
          path: cdimage-windows-x64.zip

  # ── GitHub Release (tags only) ─────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cdimage-linux-x86_64/cdimage-linux-x86_64.tar.gz
            cdimage-windows-x64/cdimage-windows-x64.zip
