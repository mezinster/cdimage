name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev-tools build-essential libgl-dev

      - name: Build app
        run: qmake6 cdimage.pro && make -j$(nproc)

      - name: Build tests
        working-directory: tests
        run: qmake6 tests.pro && make -j$(nproc)

      - name: Run tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          CDIMAGE_SKIP_LONG: "1"
        run: ./cdimage_tests -v2

  # ── Windows ────────────────────────────────────────────────────────────────
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build app
        run: |
          qmake cdimage.pro
          nmake

      - name: Build tests
        working-directory: tests
        run: |
          qmake tests.pro
          nmake

      - name: Stage Qt runtime alongside test binary
        working-directory: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          if (-not $exe) { throw "cdimage_tests.exe not built" }
          Write-Host "Found test binary at: $($exe.FullName)"
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw $exe.FullName
          # windeployqt only deploys the platform plugin it thinks the app uses
          # (qwindows.dll for GUI apps). For headless CI we run with
          # QT_QPA_PLATFORM=offscreen, which needs qoffscreen.dll. Copy it in.
          $qtBin       = (Get-Command qmake).Source | Split-Path
          $qtRoot      = Split-Path $qtBin -Parent
          $offscreen   = Join-Path $qtRoot 'plugins\platforms\qoffscreen.dll'
          $destPlatforms = Join-Path $exe.Directory.FullName 'platforms'
          if (-not (Test-Path $destPlatforms)) { New-Item -ItemType Directory $destPlatforms | Out-Null }
          Copy-Item $offscreen $destPlatforms -Force
          Write-Host "Staged qoffscreen.dll into $destPlatforms"

      - name: Inspect deployed test binary
        working-directory: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          Write-Host "----- Files in $($exe.Directory.FullName) -----"
          Get-ChildItem $exe.Directory.FullName | Format-Table Name, Length, LastWriteTime
          $platforms = Join-Path $exe.Directory.FullName 'platforms'
          if (Test-Path $platforms) {
            Write-Host "----- Files in $platforms -----"
            Get-ChildItem $platforms | Format-Table Name, Length
          } else {
            Write-Host "WARNING: $platforms does not exist"
          }
          # Quick liveness probe: can the binary load Qt and enumerate its own
          # test functions? --listfunctions completes in <1s and exits 0 on
          # success. If this fails before -v2 runs, output capture isn't the
          # problem — the binary itself can't initialize.
          Write-Host "----- Probe: --listfunctions -----"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_DEBUG_PLUGINS = '1'
          & $exe.FullName --listfunctions 2>&1 | Out-Host
          Write-Host "----- Probe exit code: $LASTEXITCODE -----"
          Remove-Item Env:\QT_DEBUG_PLUGINS

      - name: Run tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          CDIMAGE_SKIP_LONG: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          Write-Host "Running: $($exe.FullName)"
          # PowerShell pipeline capture (2>&1 | Tee-Object) reliably collects
          # both streams from a native console app, unlike Start-Process file
          # redirection which has dropped output on previous CI runs.
          & $exe.FullName -v2 2>&1 | Tee-Object -FilePath testrun.log
          $code = $LASTEXITCODE
          Write-Host "----- Exit code: $code -----"
          if ($code -ne 0) { throw "Tests failed with exit code $code" }
