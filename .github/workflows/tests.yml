name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev-tools build-essential libgl-dev

      - name: Build app
        run: qmake6 cdimage.pro && make -j$(nproc)

      - name: Build tests
        working-directory: tests
        run: qmake6 tests.pro && make -j$(nproc)

      - name: Run tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          CDIMAGE_SKIP_LONG: "1"
        run: ./cdimage_tests -v2

  # ── Windows ────────────────────────────────────────────────────────────────
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build app
        run: |
          qmake cdimage.pro
          nmake

      - name: Build tests
        working-directory: tests
        run: |
          qmake tests.pro
          nmake

      - name: Stage Qt runtime alongside test binary
        working-directory: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          if (-not $exe) { throw "cdimage_tests.exe not built" }
          Write-Host "Found test binary at: $($exe.FullName)"
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw $exe.FullName

      - name: Run tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          CDIMAGE_SKIP_LONG: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          Write-Host "Running: $($exe.FullName)"
          # Use Start-Process with file redirection — PowerShell's native-exe stdout
          # capture sometimes drops output when the process exits non-zero, hiding
          # the actual test failures from CI logs.
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '-v2' `
              -Wait -NoNewWindow -PassThru `
              -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
          Write-Host "----- STDOUT -----"
          if (Test-Path stdout.log) { Get-Content stdout.log }
          Write-Host "----- STDERR -----"
          if (Test-Path stderr.log) { Get-Content stderr.log }
          Write-Host "----- Exit code: $($proc.ExitCode) -----"
          if ($proc.ExitCode -ne 0) { throw "Tests failed with exit code $($proc.ExitCode)" }
