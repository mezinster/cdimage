name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev-tools build-essential libgl-dev

      - name: Build app
        run: qmake6 cdimage.pro && make -j$(nproc)

      - name: Build tests
        working-directory: tests
        run: qmake6 tests.pro && make -j$(nproc)

      - name: Run tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          CDIMAGE_SKIP_LONG: "1"
        run: ./cdimage_tests -v2

  # ── Windows ────────────────────────────────────────────────────────────────
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build app
        run: |
          qmake cdimage.pro
          nmake

      - name: Build tests
        working-directory: tests
        run: |
          qmake tests.pro
          nmake

      - name: Stage Qt runtime alongside test binary
        working-directory: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          if (-not $exe) { throw "cdimage_tests.exe not built" }
          Write-Host "Found test binary at: $($exe.FullName)"
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw $exe.FullName
          # windeployqt only deploys the platform plugin it thinks the app uses
          # (qwindows.dll for GUI apps). For headless CI we run with
          # QT_QPA_PLATFORM=offscreen, which needs qoffscreen.dll. Copy it in.
          $qtBin       = (Get-Command qmake).Source | Split-Path
          $qtRoot      = Split-Path $qtBin -Parent
          $offscreen   = Join-Path $qtRoot 'plugins\platforms\qoffscreen.dll'
          $destPlatforms = Join-Path $exe.Directory.FullName 'platforms'
          if (-not (Test-Path $destPlatforms)) { New-Item -ItemType Directory $destPlatforms | Out-Null }
          Copy-Item $offscreen $destPlatforms -Force
          Write-Host "Staged qoffscreen.dll into $destPlatforms"

      - name: Inspect deployed test binary
        working-directory: tests
        shell: pwsh
        # Diagnostic-only: never fails the build. Even if every probe errors,
        # the "Run tests" step still gets a chance to capture real output.
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "ERROR: cdimage_tests.exe not found"; exit 0 }
          Write-Host "----- Files in $($exe.Directory.FullName) -----"
          Get-ChildItem $exe.Directory.FullName | Format-Table Name, Length, LastWriteTime
          $platforms = Join-Path $exe.Directory.FullName 'platforms'
          if (Test-Path $platforms) {
            Write-Host "----- Files in $platforms -----"
            Get-ChildItem $platforms | Format-Table Name, Length
          } else {
            Write-Host "WARNING: $platforms does not exist"
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_DEBUG_PLUGINS = '1'
          # Two QTest probes. Both should print and exit 0 if the binary can
          # initialize Qt. -help is the most permissive (no plugin required);
          # -functions exercises the moc-built test class registry.
          Write-Host "----- Probe: -help -----"
          & $exe.FullName -help 2>&1 | Out-Host
          Write-Host "----- Probe exit code: $LASTEXITCODE -----"
          Write-Host "----- Probe: -functions -----"
          & $exe.FullName -functions 2>&1 | Out-Host
          Write-Host "----- Probe exit code: $LASTEXITCODE -----"
          Remove-Item Env:\QT_DEBUG_PLUGINS

      - name: Run tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          CDIMAGE_SKIP_LONG: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Get-ChildItem -Recurse -Filter cdimage_tests.exe | Select-Object -First 1
          Write-Host "Running: $($exe.FullName)"
          # Belt-and-suspenders capture:
          #   1) Tee-Object pipes stdout+stderr to file AND console (proven to
          #      work in Run #12 where Start-Process did not).
          #   2) -o testrun.xml,junitxml writes a structured XML report from
          #      QTest itself, surviving even if the pipeline drops bytes.
          & $exe.FullName -v2 -o testrun.xml,junitxml 2>&1 | Tee-Object -FilePath testrun.log
          $code = $LASTEXITCODE
          Write-Host "----- Exit code: $code -----"
          Write-Host "----- testrun.log size -----"
          if (Test-Path testrun.log) {
            Get-Item testrun.log | Format-Table Length, LastWriteTime
          } else { Write-Host "testrun.log missing" }
          Write-Host "----- testrun.xml (junitxml) -----"
          if (Test-Path testrun.xml) {
            Get-Content testrun.xml
          } else { Write-Host "testrun.xml missing — QTest never wrote it" }
          # If the binary crashed before flushing stdout, the OS will have
          # logged the fault to the Windows Application event log. Pull the
          # last few minutes of errors so a silent crash leaves a trail.
          Write-Host "----- Recent Application event log errors -----"
          try {
            Get-WinEvent -LogName Application -MaxEvents 50 -ErrorAction Stop |
              Where-Object {
                $_.LevelDisplayName -in 'Error','Critical' -and
                $_.TimeCreated -gt (Get-Date).AddMinutes(-5)
              } |
              Format-Table TimeCreated, ProviderName, Id, Message -AutoSize -Wrap
          } catch {
            Write-Host "Event log query failed: $_"
          }
          if ($code -ne 0) { throw "Tests failed with exit code $code" }
